# ====================================================================
# Alertmanager 配置文件（P1-13 告警通知）
# --------------------------------------------------------------------
# 路由策略：
#   - critical：立即发送（group_wait 0s）
#   - warning ：5 分钟聚合后发送（避免告警风暴）
# 抑制策略：critical 触发时抑制同类 warning，避免重复打扰
# 通知渠道：使用 webhook 占位，生产应替换为邮件 / 钉钉 / 企业微信
# ====================================================================

global:
  # 告警解决后的等待时间，超过此时间无新告警则发送 resolved 通知
  resolve_timeout: 5m
  # SMTP 配置占位（如需邮件通知，取消注释并配置真实 SMTP）
  # smtp_smarthost: 'smtp.example.com:587'
  # smtp_from: 'alert@example.com'
  # smtp_auth_username: 'alert@example.com'
  # smtp_auth_password: 'SMTP_PASSWORD'

# --------------------------------------------------------------------
# 路由：按 severity 分组，critical 立即发送，warning 聚合 5 分钟
# --------------------------------------------------------------------
route:
  receiver: 'default-webhook'      # 默认兜底接收器
  group_by: ['alertname', 'service', 'severity']  # 按告警名+服务+级别分组
  group_wait: 30s                  # 首次告警等待 30s 再发送（聚合同组）
  group_interval: 5m               # 同组下次发送间隔
  repeat_interval: 4h              # 未解决告警每 4h 重复通知一次
  routes:
    # critical 级别：立即发送，1h 内不重复
    - matchers:
        - severity = critical
      receiver: 'critical-webhook'
      group_wait: 0s               # 立即发送，不等待聚合
      group_interval: 30s
      repeat_interval: 1h
      continue: false              # 不再继续匹配后续路由
    # warning 级别：5 分钟聚合后发送
    - matchers:
        - severity = warning
      receiver: 'warning-webhook'
      group_wait: 5m               # 聚合 5 分钟内的同组告警
      group_interval: 10m
      repeat_interval: 6h
      continue: false

# --------------------------------------------------------------------
# 接收器（P1-1: 通过环境变量注入真实 webhook URL，未配置则用占位 + 启动告警）
# 生产环境部署前必须设置以下环境变量（在 docker-compose 中通过 environment 注入）：
#   ALERTMANAGER_CRITICAL_WEBHOOK  critical 告警通知 URL（钉钉/企业微信/邮件网关）
#   ALERTMANAGER_WARNING_WEBHOOK   warning 告警通知 URL
#   ALERTMANAGER_DEFAULT_WEBHOOK   兜底通知 URL
# Alertmanager 原生不支持环境变量插值，需在部署时用 envsubst 渲染，或直接编辑本文件。
# --------------------------------------------------------------------
receivers:
  - name: 'default-webhook'
    webhook_configs:
      # 生产环境：通过 ALERTMANAGER_DEFAULT_WEBHOOK 环境变量注入真实 URL
      # 钉钉: https://oapi.dingtalk.com/robot/send?access_token=XXX
      # 企业微信: https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=XXX
      # 未配置时指向本地 5001 端口的告警转发服务（需另部署）
      - url: '${ALERTMANAGER_DEFAULT_WEBHOOK:http://127.0.0.1:5001/alertmanager/default}'
        send_resolved: true

  - name: 'critical-webhook'
    webhook_configs:
      # P1-1: critical 告警必须配置真实多渠道通知（电话+短信+邮件+IM）
      # 通过 ALERTMANAGER_CRITICAL_WEBHOOK 环境变量注入（部署时用 alertmanager-entrypoint.sh 渲染）
      - url: '${ALERTMANAGER_CRITICAL_WEBHOOK:http://127.0.0.1:5001/alertmanager/critical}'
        send_resolved: true
    # 生产环境邮件接收器（取消注释并配置 SMTP 后启用，配合上方 global.smtp_* 配置）
    # email_configs:
    #   - to: 'ops-oncall@example.com'
    #     headers:
    #       Subject: '【CRITICAL】{{ .CommonLabels.alertname }} - {{ .CommonLabels.service }}'

  - name: 'warning-webhook'
    webhook_configs:
      - url: '${ALERTMANAGER_WARNING_WEBHOOK:http://127.0.0.1:5001/alertmanager/warning}'
        send_resolved: true

# --------------------------------------------------------------------
# 抑制规则：critical 触发时抑制同服务的 warning，避免重复告警
# --------------------------------------------------------------------
inhibit_rules:
  # 规则 1：当某服务有 critical 告警时，抑制同服务的 warning
  - source_matchers:
      - severity = critical
    target_matchers:
      - severity = warning
    equal: ['service', 'alertname']

  # 规则 2：服务 down 时抑制该服务的其他告警（服务都挂了，其他告警无意义）
  - source_matchers:
      - alertname = ServiceDown
    target_matchers:
      - severity = warning
    equal: ['service']
