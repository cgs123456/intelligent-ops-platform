{{- /*
   Secret：仅用于本地测试，包含 DB_PASSWORD / REDIS_PASSWORD / SECRET_KEY / CORS_ORIGINS 占位值
   ⚠️ 生产环境严禁将真实密钥写入此文件！
   生产建议：
     1. 设置 secret.create=false 关闭本模板
     2. 使用 External Secrets Operator / Sealed Secrets / 云厂商 KMS 管理密钥
     3. 或通过 kubectl create secret 手工创建后由 chart 引用
   */ -}}
{{- /* P1-4: 占位密钥校验 —— secret.create=true 时 SECRET_KEY 不得仍为 REPLACE_ME 开头的占位值 */ -}}
{{- if and .Values.secret.create (hasPrefix "REPLACE_ME" .Values.secret.data.SECRET_KEY) -}}
{{- fail "secret.data.SECRET_KEY 仍为占位值（REPLACE_ME 开头），生产环境必须替换为强随机密钥。生成方式：python -c \"import secrets; print(secrets.token_hex(32))\"" -}}
{{- end -}}
{{- /* P0-7: FIELD_ENCRYPTION_KEY placeholder check */ -}}
{{- if and .Values.secret.create (hasPrefix "REPLACE_ME" .Values.secret.data.FIELD_ENCRYPTION_KEY) -}}
{{- fail "secret.data.FIELD_ENCRYPTION_KEY is placeholder (REPLACE_ME prefix), must replace with strong random key. Generate: python -c \"import secrets; print(secrets.token_hex(32))\"" -}}
{{- end -}}
{{- if .Values.secret.create -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secret.name }}
  labels:
    {{- include "intelligent-ops-platform.labels" . | nindent 4 }}
type: Opaque
# stringData 字段使用明文（Helm 渲染后由 K8s 自动 base64 编码），便于占位值可读
# ⚠️ 以下均为占位值，生产环境必须替换为强随机值！
stringData:
  SECRET_KEY: {{ .Values.secret.data.SECRET_KEY | quote }}
  DB_PASSWORD: {{ .Values.secret.data.DB_PASSWORD | quote }}
  REDIS_PASSWORD: {{ .Values.secret.data.REDIS_PASSWORD | quote }}
  CORS_ORIGINS: {{ .Values.secret.data.CORS_ORIGINS | quote }}
  FIELD_ENCRYPTION_KEY: {{ .Values.secret.data.FIELD_ENCRYPTION_KEY | quote }}
{{- end }}
