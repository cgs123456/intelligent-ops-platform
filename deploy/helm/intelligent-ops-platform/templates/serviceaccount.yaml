{{- /* ServiceAccount：仅当 serviceAccount.create=true 时创建 */ -}}
{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "intelligent-ops-platform.serviceAccountName" . }}
  labels:
    {{- include "intelligent-ops-platform.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}
