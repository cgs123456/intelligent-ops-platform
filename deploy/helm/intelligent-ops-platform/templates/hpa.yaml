{{- /*
   HorizontalPodAutoscaler：基于 CPU / 内存 / 自定义指标的弹性伸缩
   - 扩容触发：CPU 平均利用率 > targetCPUUtilizationPercentage（默认 70%）
              或内存平均利用率 > targetMemoryUtilizationPercentage（默认 80%）
              或 HTTP 请求 P95 延迟 > targetRequestP95Latency（默认 500ms）
   - 缩容策略：stabilizationWindowSeconds 稳定窗口（默认 300s）后平滑缩容，
              通过 Percent / Pods 两种 policy 取 Max，避免副本数抖动
   - 启用后 Deployment.spec.replicas 由 HPA 接管
   - P2-12: 自定义指标 flask_http_request_duration_seconds（P95）通过 Prometheus Adapter
            暴露为 Pods 类型指标，需部署 prometheus-adapter 并配置规则映射该 PromQL。
   */ -}}
{{- if .Values.hpa.enabled -}}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "intelligent-ops-platform.fullname" . }}
  labels:
    {{- include "intelligent-ops-platform.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "intelligent-ops-platform.fullname" . }}
  minReplicas: {{ .Values.hpa.minReplicas }}
  maxReplicas: {{ .Values.hpa.maxReplicas }}
  metrics:
    # CPU 平均利用率超过 70% 触发扩容
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.hpa.targetCPUUtilizationPercentage }}
    # 内存平均利用率超过 80% 触发扩容
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.hpa.targetMemoryUtilizationPercentage }}
    {{- /* P2-12: 自定义指标 —— Flask HTTP 请求 P95 延迟（基于延迟的弹性伸缩）
            依赖 prometheus-adapter 将 histogram_quantile(0.95, ...) 映射为
            自定义指标 flask_http_request_duration_seconds_p95。
            若未部署 adapter，HPA 会将该指标标记为 unknown，不影响 CPU/内存伸缩。 */ -}}
    {{- if .Values.hpa.customMetrics.requestP95Latency.enabled }}
    - type: Pods
      pods:
        metric:
          name: {{ .Values.hpa.customMetrics.requestP95Latency.metricName | default "flask_http_request_duration_seconds_p95" }}
        target:
          # AverageValue：各 Pod 指标平均值达到阈值即扩容
          type: AverageValue
          averageValue: {{ .Values.hpa.customMetrics.requestP95Latency.targetAverageValue | default "500m" | quote }}
    {{- end }}
  # 弹性伸缩行为策略（平滑缩容，避免抖动）
  behavior:
    {{- toYaml .Values.hpa.behavior | nindent 4 }}
{{- end }}
