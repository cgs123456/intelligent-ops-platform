{{- if .Values.celery.enabled }}
# P2-7: celery worker Deployment —— 此前 chart 只部署 web，异步任务/定时调度在 K8s 下缺失
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "intelligent-ops-platform.fullname" . }}-worker
  labels:
    {{- include "intelligent-ops-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: celery-worker
spec:
  replicas: {{ .Values.celery.worker.replicas }}
  selector:
    matchLabels:
      {{- include "intelligent-ops-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: celery-worker
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "intelligent-ops-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: celery-worker
    spec:
      serviceAccountName: {{ include "intelligent-ops-platform.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # celery 优雅关闭：等待任务完成（acks_late 下未完成任务会重新投递）
      terminationGracePeriodSeconds: {{ .Values.celery.worker.terminationGracePeriodSeconds }}
      containers:
        - name: celery-worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command: ["celery", "-A", "tasks.celery_app", "worker", "--loglevel=info"]
          args: ["--concurrency={{ .Values.celery.worker.concurrency }}"]
          envFrom:
            - configMapRef:
                name: {{ include "intelligent-ops-platform.fullname" . }}-config
          env:
            - name: DB_HOST
              value: {{ .Values.postgresql.externalDatabase.host | quote }}
            - name: DB_PORT
              value: {{ .Values.postgresql.externalDatabase.port | quote }}
            - name: DB_USER
              value: {{ .Values.postgresql.externalDatabase.user | quote }}
            - name: DB_NAME
              value: {{ .Values.postgresql.externalDatabase.database | quote }}
            - name: REDIS_HOST
              value: {{ .Values.redis.host | quote }}
            - name: REDIS_PORT
              value: {{ .Values.redis.port | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: DB_PASSWORD
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: REDIS_PASSWORD
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: SECRET_KEY
            - name: CORS_ORIGINS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: CORS_ORIGINS
            - name: FIELD_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: FIELD_ENCRYPTION_KEY
            - name: DATABASE_URL
              value: "postgresql://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)"
            - name: CACHE_REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@$(REDIS_HOST):$(REDIS_PORT)/0"
            - name: RATELIMIT_STORAGE_URL
              value: "redis://:$(REDIS_PASSWORD)@$(REDIS_HOST):$(REDIS_PORT)/1"
            - name: CELERY_BROKER_URL
              value: "redis://:$(REDIS_PASSWORD)@$(REDIS_HOST):$(REDIS_PORT)/2"
            - name: CELERY_RESULT_BACKEND
              value: "redis://:$(REDIS_PASSWORD)@$(REDIS_HOST):$(REDIS_PORT)/3"
          {{- with .Values.celery.worker.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: instance-logs
              mountPath: /app/instance/logs
      volumes:
        - name: tmp
          emptyDir: {}
        - name: instance-logs
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
