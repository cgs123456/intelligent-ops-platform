# ===================================================================
# 智能运营平台 Helm Chart 默认配置
# 所有参数均已参数化，可按环境覆盖
# ===================================================================

# 副本数（HPA 启用后由 HPA 接管副本数，此值仅在 HPA 禁用时生效）
replicaCount: 2

# 镜像配置
image:
  repository: intelligent-ops-platform
  tag: latest
  pullPolicy: IfNotPresent

# 私有镜像仓库拉取凭据（无需则留空）
imagePullSecrets: []

# 覆盖 chart 名称 / 完整名称（留空则自动生成）
nameOverride: ""
fullnameOverride: ""

# ServiceAccount 配置
serviceAccount:
  # 是否创建 ServiceAccount（应用无需访问 K8s API，默认关闭 automount）
  create: true
  automount: false
  annotations: {}
  # 名称留空则使用 fullname
  name: ""

# Pod 级安全上下文（非 root 运行）
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

# Pod 注解（如 Prometheus 抓取注解等）
podAnnotations: {}

# 容器级安全上下文（只读根文件系统 + 非 root + 禁止提权）
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# Service
service:
  type: ClusterIP
  port: 5000

# Ingress
ingress:
  enabled: true
  className: nginx
  annotations: {}
  hosts:
    - host: ops.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  # tls 启用示例：
  # tls:
  #   - secretName: ops-tls
  #     hosts:
  #       - ops.example.com

# 容器资源限制（requests/limits）
resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# 健康探针（与 Dockerfile HEALTHCHECK 端点保持一致）
probes:
  liveness:
    path: /health/live
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /health/ready
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

# ===================================================================
# 弹性伸缩（HPA / autoscaling）
# 触发条件：当 Pod 平均 CPU 利用率 > 70% 或平均内存利用率 > 80% 时扩容；
#           指标回落且稳定窗口（300s）后平滑缩容。
# 注意：启用 HPA 后 Deployment.spec.replicas 由 HPA 接管，
#       values.replicaCount 不再生效，仅作为初始/下限参考。
# ===================================================================
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  # 缩容行为策略：平滑缩容，避免抖动
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        # 每 60s 最多缩容 50% 副本
        - type: Percent
          value: 50
          periodSeconds: 60
        # 每 60s 最多缩容 1 个副本
        - type: Pods
          value: 1
          periodSeconds: 60
      # 取上述两策略中影响更大的（即缩容更保守的上限）
      selectPolicy: Max
  # P2-12: 自定义指标扩容（基于 HTTP 请求 P95 延迟）
  # 依赖 prometheus-adapter 将 PromQL 映射为自定义指标：
  #   histogram_quantile(0.95, sum(rate(flask_http_request_duration_seconds_bucket[5m])) by (le))
  # adapter rule 示例：
  #   - seriesQuery: 'flask_http_request_duration_seconds_bucket'
  #     resources: { overrides: { kubernetes_pod_name: { resource: pod } } }
  #     name: { matches: "^(.*)_bucket"; as: "${1}_p95" }
  #     queries:
  #       - aggregate: "quantile(0.95, sum(rate(<<.Series>>[5m])) by (le, <<.GroupBy>>))"
  customMetrics:
    requestP95Latency:
      enabled: true
      # 自定义指标名称（需与 prometheus-adapter 映射规则产物一致）
      metricName: flask_http_request_duration_seconds_p95
      # 扩容阈值：Pod 平均 P95 延迟达到 500ms 即触发扩容
      targetAverageValue: 500m

# 非敏感环境变量（写入 ConfigMap，敏感值见 secret 段）
env:
  FLASK_ENV: production
  RBAC_ENABLED: "1"
  METRICS_ENABLED: "1"
  CACHE_TYPE: redis
  CACHE_DEFAULT_TIMEOUT: "3600"
  RATELIMIT_DEFAULT: "200/hour"
  RATELIMIT_AUTH: "10/minute"
  LLM_PROVIDER: rule
  GUNICORN_WORKERS: "5"
  GUNICORN_LOG_LEVEL: info

# 外部 PostgreSQL（externalDatabase 模式，不在 chart 内部署数据库）
postgresql:
  externalDatabase:
    host: postgresql.external.svc.cluster.local
    port: 5432
    user: ops
    database: ops_platform
    # 密码不在 values 明文配置，运行时从 Secret 引用（见 secret 段 key=DB_PASSWORD）

# 外部 Redis（不在 chart 内部署）
redis:
  host: redis.external.svc.cluster.local
  port: 6379
  # 密码从 Secret 引用（见 secret 段 key=REDIS_PASSWORD）

# Secret 占位（仅用于本地测试）
# ⚠️ 生产环境必须替换以下占位值！
# 生产建议：使用 External Secrets、Sealed Secrets 或云厂商 KMS 托管，
#           禁止将真实密钥提交到版本库。可通过设置 secret.create=false 关闭此模板。
secret:
  create: true
  name: intelligent-ops-platform-secret
  data:
    # ⚠️ 占位值，生产必须替换为强随机值
    SECRET_KEY: "REPLACE_ME_WITH_STRONG_SECRET_KEY"
    DB_PASSWORD: "REPLACE_ME_WITH_DB_PASSWORD"
    REDIS_PASSWORD: "REPLACE_ME_WITH_REDIS_PASSWORD"
    # CORS 允许源（生产必须显式指定，不可用 *）
    CORS_ORIGINS: "https://ops.example.com"
    # P0-7 fix: field encryption key (required by ProdConfig)
    FIELD_ENCRYPTION_KEY: "REPLACE_ME_WITH_FIELD_ENCRYPTION_KEY"

# 节点调度
nodeSelector: {}
tolerations: []
affinity: {}

# ===================================================================
# NetworkPolicy（P2-7：默认拒绝入站，仅允许 web 端口）
# 入站仅放行同命名空间 Pod + Ingress 控制器命名空间访问 service.port；
# 出站默认放行（应用需访问 PostgreSQL / Redis / 外部 API）。
# 注意：要求集群 CNI 支持 NetworkPolicy（Calico / Cilium / kube-router）。
# ===================================================================
networkPolicy:
  enabled: true
  # Ingress 控制器所在命名空间选择器（按命名空间标签匹配）
  # 示例：{ "kubernetes.io/metadata.name": "ingress-nginx" } 或 { "network-policy/allow-ingress": "true" }
  ingressNamespaceSelector: {}
  # 额外放行的入站来源（命名空间/Pod 选择器列表），如监控命名空间抓取 /metrics
  # 示例：
  #   - namespaceSelector:
  #       kubernetes.io/metadata.name: monitoring
  ingressFrom: []
  # 出站白名单（留空则放行所有出站；收紧示例见下方注释）
  # egress:
  #   - to:
  #       - namespaceSelector: {}
  #     ports:
  #       - protocol: TCP
  #         port: 5432   # PostgreSQL
  #       - protocol: TCP
  #         port: 6379   # Redis
  egress: []

# ===================================================================
# P2-7: Celery（异步任务 + 定时调度）
# web Deployment 不跑任务；worker/beat 由以下配置独立部署
# ===================================================================
celery:
  enabled: true
  worker:
    replicas: 2
    concurrency: 2
    # acks_late 下等待任务完成的时间上限
    terminationGracePeriodSeconds: 90
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
  beat:
    enabled: true
    # 单实例策略已在模板固化（Recreate），防双调度
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
