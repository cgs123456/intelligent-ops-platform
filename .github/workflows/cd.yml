name: CD - Build and Deploy

on:
  # P0 修复：main 分支部署改由 CI 成功后触发（workflow_run），
  # 原先 push 直接部署，测试/安全扫描失败的同一次提交照样上线
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      action:
        description: "部署动作"
        required: true
        default: "deploy"
        type: choice
        options:
          - deploy
          - rollback

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ==================== 构建 ====================
  build:
    runs-on: ubuntu-latest
    # workflow_run 门禁：CI 失败/取消时不构建；tag push 与手动触发不受影响
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==================== 部署 ====================
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: |
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /opt/ops-platform
            IMAGE=$(echo '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')
            NEW_TAG="${IMAGE}:${{ needs.build.outputs.image_tag }}"
            # 更新 .env 中的 IMAGE_TAG（web/celery-worker/celery-beat 统一使用，保证版本一致）
            grep -v '^IMAGE_TAG=' .env > .env.tmp || true
            echo "IMAGE_TAG=${NEW_TAG}" >> .env.tmp
            mv .env.tmp .env
            # 拉取最新镜像
            docker-compose -f docker-compose.prod.yml pull
            # 数据库迁移：切流前用新镜像执行，避免新代码 + 旧 schema 启动 500
            docker-compose -f docker-compose.prod.yml run --rm web flask db upgrade
            # 启动新 web + 同步更新 Celery（此前只更新 web，worker/beat 一直跑旧代码）
            docker-compose -f docker-compose.prod.yml up -d --no-deps web celery-worker celery-beat
            sleep 10
            # 健康检查：失败必须中止并 exit 1（此前失败仍继续 reload nginx 且任务退出码为 0，
            # 坏版本会被判定为部署成功）
            HEALTHY=0
            for i in {1..12}; do
              if curl -sf http://localhost:5000/health/ready > /dev/null; then
                HEALTHY=1
                break
              fi
              sleep 5
            done
            if [ "$HEALTHY" != "1" ]; then
              echo "Health check failed after deploy!"
              docker-compose -f docker-compose.prod.yml ps
              docker-compose -f docker-compose.prod.yml logs --tail=50 web
              exit 1
            fi
            # 部署状态持久化在部署机（runner 工作区跨 job 不共享，
            # 原实现把 current.json 写在 runner 上，回滚永远找不到 previous）
            mkdir -p .deploy
            if [ -f .deploy/current.json ]; then
              cp .deploy/current.json .deploy/previous.json
            fi
            echo "{\"tag\":\"${NEW_TAG}\",\"digest\":\"${{ needs.build.outputs.image_digest }}\",\"deployed_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"commit\":\"${{ github.sha }}\"}" > .deploy/current.json
            # 重载 nginx（compose 服务名为 nginx，非 ops_nginx）
            docker exec nginx nginx -s reload
            echo "Deployed ${NEW_TAG}"

  # ==================== 回滚 ====================
  rollback:
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'rollback'
    environment: production
    steps:
      - name: Rollback via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /opt/ops-platform
            # 从部署机读取上一版本（原实现在 runner checkout 里找 previous.json，永远找不到）
            if [ ! -f .deploy/previous.json ]; then
              echo "No previous deployment found for rollback"
              exit 1
            fi
            PREV_TAG=$(jq -r .tag .deploy/previous.json)
            if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" = "null" ]; then
              echo "Invalid previous tag"
              exit 1
            fi
            echo "Rolling back to: ${PREV_TAG}"
            docker pull "${PREV_TAG}"
            # 回滚 env：复制完整 .env 再覆盖 IMAGE_TAG（原 .deploy/.env 只含 IMAGE_TAG，
            # 会触发 SECRET_KEY 等必填校验报错，回滚必然失败）
            grep -v '^IMAGE_TAG=' .env > .env.tmp || true
            echo "IMAGE_TAG=${PREV_TAG}" >> .env.tmp
            mv .env.tmp .env
            docker-compose -f docker-compose.prod.yml up -d --no-deps web celery-worker celery-beat
            sleep 10
            HEALTHY=0
            for i in {1..12}; do
              if curl -sf http://localhost:5000/health/ready > /dev/null; then
                HEALTHY=1
                break
              fi
              sleep 5
            done
            if [ "$HEALTHY" != "1" ]; then
              echo "Rollback health check failed!"
              exit 1
            fi
            # 回滚成功后交换 current/previous
            if [ -f .deploy/current.json ]; then
              cp .deploy/current.json .deploy/rollback-done.json
            fi
            docker exec nginx nginx -s reload
            echo "Rollback successful"
