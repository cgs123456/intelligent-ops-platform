name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Ruff check
        run: ruff check .
      - name: Black format check
        run: black --check .
      - name: Mypy type check
        # P1-18: 逐步扩大 mypy 检查范围，当前覆盖核心模块
        # 禁用 no-untyped-def（项目大量函数无注解）+ import-untyped（Flask 库类型缺失）
        run: mypy --ignore-missing-imports --no-strict-optional --disable-error-code=no-untyped-def --disable-error-code=import-untyped app.py config.py extensions.py middleware.py schemas.py services/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run tests with coverage
        env:
          FLASK_ENV: development
          TESTING: '1'
        # P1-4: coverage 门槛提升至 60%（硬约束要求），未达标 CI 失败
        run: pytest --cov=. --cov-report=xml --cov-report=term-missing --cov-fail-under=60 -v
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run bandit security scan
        # P1-20: HIGH 级别安全漏洞阻断 CI，MEDIUM 仅告警（-lll = 只报 HIGH）
        run: bandit -r . -x tests,.venv,migrations -lll
      - name: Run pip-audit for dependency CVE scan
        # P1-5: 依赖 CVE 扫描，HIGH/CRITICAL 阻断 CI（硬约束：CI must include pip-audit for CVE scanning）
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --strict --vulnerability-service osv

  migrate:
    # P0: 迁移链完整性验证——在空 PostgreSQL 上跑全量 flask db upgrade。
    # SQLite 因跳过 PG 专属 DDL 无法覆盖此路径；此前迁移文件从未在 PG 上验证过。
    name: Migration Chain (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ops
          POSTGRES_PASSWORD: ops
          POSTGRES_DB: ops_migrate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ops"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run full migration chain on empty database
        env:
          FLASK_ENV: production
          DATABASE_URL: postgresql://ops:ops@localhost:5432/ops_migrate_test
          # ProdConfig 必填项（只为通过启动校验，值无实际作用）
          SECRET_KEY: ci-migration-check-secret-key-0123456789abcdef
          FIELD_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          CELERY_BROKER_URL: redis://localhost:6379/0
          RATELIMIT_STORAGE_URI: redis://localhost:6379/1
          CORS_ORIGINS: http://localhost
        run: |
          flask db upgrade
      - name: Verify database is at head with expected objects
        # 不用 `flask db check`：alembic autogenerate 不理解声明式分区，
        # 会把 audit_log 月分区的子表误报为 remove_table 差异
        env:
          FLASK_ENV: production
          DATABASE_URL: postgresql://ops:ops@localhost:5432/ops_migrate_test
          SECRET_KEY: ci-migration-check-secret-key-0123456789abcdef
          FIELD_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          CELERY_BROKER_URL: redis://localhost:6379/0
          RATELIMIT_STORAGE_URI: redis://localhost:6379/1
          CORS_ORIGINS: http://localhost
        run: |
          flask db current | tee /tmp/db_current.txt
          grep -q '(head)' /tmp/db_current.txt || { echo '数据库未到迁移链 head'; exit 1; }
          TABLES=$(PGPASSWORD=ops psql -h localhost -U ops -d ops_migrate_test -t -A \
            -c "select count(*) from information_schema.tables where table_schema='public'")
          echo "public 表数量: $TABLES"
          [ "$TABLES" -ge 50 ] || { echo '表数量异常，baseline 建表不完整'; exit 1; }
          PGPASSWORD=ops psql -h localhost -U ops -d ops_migrate_test -t -A \
            -c "select 1 from pg_tables where schemaname='public' and tablename='audit_log_default'" \
            | grep -q 1 || { echo 'audit_log 分区缺失'; exit 1; }

  build:
    name: Docker Build & Scan
    runs-on: ubuntu-latest
    # P2-25: build 依赖 security，确保安全扫描通过后才构建镜像
    # migrate 加入前置：迁移链在 PG 上跑不通的提交不允许构建镜像
    needs: [lint, test, security, migrate]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t intelligent-ops-platform:ci .
      - name: Trivy image security scan
        # P1-19: 镜像漏洞扫描，HIGH/CRITICAL 阻断
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: intelligent-ops-platform:ci
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
      - name: Save image SHA tag
        run: docker tag intelligent-ops-platform:ci intelligent-ops-platform:$(git rev-parse --short HEAD)
